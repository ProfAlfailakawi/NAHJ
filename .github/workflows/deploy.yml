# «نشر نهج» — يدوي فقط (workflow_dispatch). لا يعمل عند الدفع إلى main.
#
# ما يحدث فعلاً في الإنتاج (تحقّقٌ للقراءة فقط، 2026-11-13):
#   https://nahj-os.web.app = Firebase Hosting يمرّر كل الطلبات إلى خدمة Cloud Run
#   «nahj» (europe-west2، مشروع nahj-a27a4، min 0 / max 1). الحالة تبقى عبر مرآة
#   Neon (NAHJ_NEON_URL) لا عبر قرصٍ دائم. الصورة تُبنى وتُنشر بـ cloudbuild.yaml
#   باليد:
#     gcloud builds submit --config cloudbuild.yaml --substitutions=COMMIT_SHA=$(git rev-parse HEAD) --project nahj-a27a4
#   مُشغِّل Cloud Build «nahj-deployer» (push إلى main) موجود لكنه مُعطَّل، فالدمج
#   في main لا ينشر شيئاً تلقائياً — لا من هنا ولا من Cloud Build.
#
# هذا الملف مسارٌ احتياطي غير مُفعَّل: ينشر على خادم VM بقرص دائم عبر
#   scripts/deploy-vm.sh (لمن يريد SQLite على قرصٍ دائم بلا Neon — المقارنة في
#   docs/deploy-nahj.md). متغيّرات هوية النشر (GCP_*) غير مضبوطة في المستودع،
#   فكل تشغيلٍ يدوي يجتاز الفحوص ثم يتخطّى خطوة النشر ولا يمسّ الإنتاج.
#
#   فالنشر هنا يمرّ بسكربت المستودع نفسه لا بأمرٍ يُعاد كتابته هنا: هو يحمل
#   قرارات لا يجوز أن تُفقد — لا يحذف القرص الدائم ولا يمسّ بياناته، ويوقف
#   الحاوية بـ SIGTERM ومهلة حتى يدفق الخادم حالته ويغلق القاعدة، ويرفض إعلان
#   النجاح حتى يردّ الخادم فعلاً. إعادة كتابته هنا كانت ستفقدها بصمت.

name: نشر نهج

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

# خادمٌ واحد وقرصٌ واحد: نشران متوازيان يتنازعان الحاوية نفسها.
concurrency:
  group: nahj-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 ليس اختياراً: التخزين يستعمل `node:sqlite` المدمج، وهو غير موجود
          # في الأقدم. الأقدم لا يفشل في البناء — يفشل في الاختبارات بغموض.
          node-version: 22
          cache: 'npm'

      - name: تثبيت الحزم
        run: npm ci

      # لا نشر فوق فحصٍ أحمر.
      - name: فحص الأنواع
        run: npm run typecheck

      - name: الاختبارات
        run: npm test

      # إعدادٌ لمرة واحدة لم يُنفَّذ بعد ليس عطبًا في هذا التغيير: لا شيء انكسر، ولا
      # شيء يُصلَح في الشيفرة. و`exit 1` كان يضع علامةً حمراء على كل دمجٍ إلى الأبد،
      # فتفقد العلامة معناها ولا يُميَّز بعدها فشلٌ حقيقي حين يقع.
      #
      # فتقف المهمة وتقول لماذا — تنبيهٌ على صفحة التشغيل وملخّصٌ مقروء — ولا تدّعي
      # نشرًا لم يقع: كل خطوة بعدها مشروطة بأن الهوية مضبوطة.
      - name: التحقق من إعداد هوية النشر
        id: identity
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          MISSING=""
          if [[ -z "$WIF_PROVIDER" ]]; then MISSING="$MISSING GCP_WORKLOAD_IDENTITY_PROVIDER"; fi
          if [[ -z "$DEPLOY_SERVICE_ACCOUNT" ]]; then MISSING="$MISSING GCP_DEPLOY_SERVICE_ACCOUNT"; fi
          if [[ -z "$PROJECT_ID" ]]; then MISSING="$MISSING GCP_PROJECT_ID"; fi
          if [[ -n "$MISSING" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=لم يُنشر شيء::هوية النشر غير مُعدّة بعد. الخطوات في docs/deploy-nahj.md"
            {
              echo "## لم يُنشر شيء — والتغيير سليم"
              echo ""
              echo "الفحوص مرّت، ولم يُنشر شيء لأن **هوية النشر غير مُعدّة بعد**."
              echo "هذا إعدادٌ لمرة واحدة على صاحب المستودع، لا عطبٌ في هذا التغيير."
              echo ""
              echo "الناقص:$MISSING"
              echo ""
              echo "الخطوات في \`docs/deploy-nahj.md\`، ثم تُضاف القيم في:"
              echo "Settings → Secrets and variables → Actions → **Variables**"
              echo ""
              echo "وبمجرد إضافتها يمضي النشر عند التشغيل اليدوي التالي بلا تعديلٍ هنا."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: مصادقة Google Cloud بلا مفتاح دائم
        if: steps.identity.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.identity.outputs.configured == 'true'
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # السكربت نفسه يتحقق بعد النشر أن الخادم يردّ، ويخرج بـ 1 إن لم يردّ —
      # فلا حاجة إلى خطوة تحقّقٍ ثانية هنا، ولا يجوز أن نعلن نجاحاً دونه.
      - name: النشر عبر سكربت المستودع
        if: steps.identity.outputs.configured == 'true'
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ZONE: ${{ vars.GCP_ZONE }}
          NAHJ_DOMAIN: ${{ vars.NAHJ_DOMAIN }}
          # خوادم العملاء — سطرٌ لكل عميل: «اسم_الخادم النطاق [المنطقة]»، مثل:
          #   nahj-shifa  app.shifa-clinic.com
          #   nahj-mizan  nahj.almizan-law.com  europe-west1-b
          # كلٌّ على خادمه وقرصه، ويُحدَّث بالصورة نفسها بعد نشرك. فارغٌ = نشرك وحده.
          NAHJ_CUSTOMERS: ${{ vars.NAHJ_CUSTOMERS }}
        run: |
          set -euo pipefail
          # اختياريان: للسكربت افتراضٌ لكلٍّ منهما، وتمرير متغيّرٍ فارغ يدهسه.
          # فيسقط اشتقاق الاسم عبر sslip.io، وتفشل شهادة Let's Encrypt.
          [[ -n "${ZONE:-}" ]] || unset ZONE
          [[ -n "${NAHJ_DOMAIN:-}" ]] || unset NAHJ_DOMAIN
          DEFAULT_ZONE="${ZONE:-europe-west1-b}"
          # صورةٌ واحدة لكل الخوادم: تُبنى مرة في نشرك، ويُعاد استعمالها للعملاء.
          export IMAGE="${DEFAULT_ZONE%-*}-docker.pkg.dev/${PROJECT_ID}/nahj/nahj:${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"

          echo "::group::نشرك — الموقع الرئيسي"
          bash scripts/deploy-vm.sh
          echo "::endgroup::"

          # عميلٌ يفشل نشره لا يوقف الباقين — ويُعلن فشله في النهاية فلا يُخفى.
          FAILED=""
          while read -r CUSTOMER_INSTANCE CUSTOMER_DOMAIN CUSTOMER_ZONE _; do
            [[ -z "${CUSTOMER_INSTANCE:-}" || "$CUSTOMER_INSTANCE" == \#* ]] && continue
            echo "::group::عميل — $CUSTOMER_INSTANCE (${CUSTOMER_DOMAIN:-بلا نطاق})"
            if ! INSTANCE="$CUSTOMER_INSTANCE" DATA_DISK="${CUSTOMER_INSTANCE}-data" \
                 ZONE="${CUSTOMER_ZONE:-$DEFAULT_ZONE}" NAHJ_DOMAIN="${CUSTOMER_DOMAIN:-}" \
                 NAHJ_MARKETING=off SKIP_BUILD=1 bash scripts/deploy-vm.sh; then
              FAILED="$FAILED $CUSTOMER_INSTANCE"
            fi
            echo "::endgroup::"
          done <<< "${NAHJ_CUSTOMERS:-}"
          if [[ -n "$FAILED" ]]; then
            echo "::error title=تعذّر نشر عملاء::$FAILED"
            exit 1
          fi
