<!doctype html>
<!--
  صفحة «نُحدّث البرنامج».

  أثناء النشر تتوقّف حاوية نهج ثم تعود، فيجيب Caddy أمامها عن الطلبات بـ502 بلا
  نصّ، أو ينقطع الاتصال لحظةَ إعادة تشغيله. هذه الصفحة هي ما يُعرض حينها بدل صفحة
  بيضاء أو خطأٍ إنجليزي.

  نهج بلا عامل خدمة، فلا شيء يحفظها مسبقاً في المتصفح: تُقدَّم من الخادم نفسه
  (server/updatingPage.ts يضع nonce على سكربتها لتمرّ سياسة CSP) لمن يفتحها، وهي
  جاهزةٌ لعاملٍ أو وكيلٍ يقدّمها لاحقاً بلا تعديل. والتطبيق المفتوح يعرض شريطاً
  هادئاً بالمعنى نفسه (src/lib/updatingNotice.ts).

  مستقلّةٌ تماماً: لا طلبَ خارجياً، والخطُّ Cairo المستضاف ذاتياً إن وُجد وإلا خطُّ
  النظام. تسأل /api/health كل ثلاث ثوانٍ (وتتباطأ تدريجياً)، فإذا أجاب أعادت فتح
  الصفحة المطلوبة. وإن عادت الصفحةُ تتعثّر والخادمُ سليم ثلاثَ مرّاتٍ في دقيقتين،
  تباطأت إلى مرّةٍ كل نصف دقيقة ولا تدور في حلقة.

  الهوية: علامة نهج كما في src/components/Brand.tsx — المسار يُرسم ويعود، والنقطتان
  (الكهرماني والسماوي) تومضان حول الهالة. بلا رموز تعبيرية ولا نجوم (DESIGN_SYSTEM.md).
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1814" media="(prefers-color-scheme: dark)">
<title>نُحدّث البرنامج · نهج</title>
<style>
@font-face{font-family:"Cairo";font-style:normal;font-weight:200 1000;font-display:swap;src:url("/fonts/cairo-arabic.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
:root{
  --bg:#f4f1e8;--ink:#10251f;--muted:#5e6862;--line:rgb(16 37 31 / .10);
  --accent:#2f7d65;--glow:rgba(47,125,101,.13);--scan:#2f7d65;--amber:#e0a04b;--sky:#5e79e6;
  --tile:#fffdf7;--tile-line:rgb(16 37 31 / .08);--mark-ink:#10251f;
  --button:#fffdf7;--button-line:rgb(16 37 31 / .16);--shadow:rgba(16,37,31,.16);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b1814;--ink:#eef2ec;--muted:#a7b3ad;--line:rgb(255 255 255 / .09);
    --accent:#6fbf9f;--glow:rgba(47,125,101,.24);--scan:#6fbf9f;
    --tile:rgba(255,255,255,.07);--tile-line:rgba(255,255,255,.12);--mark-ink:#ffffff;
    --button:#12221d;--button-line:rgb(255 255 255 / .14);--shadow:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;min-height:100%;display:grid;place-items:center;
  padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  background:radial-gradient(circle at 50% 40%,var(--glow),transparent 46%),var(--bg);
  color:var(--ink);
  font-family:"Cairo",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  font-synthesis:none;-webkit-font-smoothing:antialiased;text-align:center;
}
main{display:grid;justify-items:center;gap:0;max-width:420px;width:100%}
.stage{position:relative;width:132px;height:132px;display:grid;place-items:center;margin-bottom:30px}
.halo{position:absolute;inset:0;width:100%;height:100%;animation:turn 3.6s linear infinite}
.halo circle{fill:none;stroke-width:2;stroke-linecap:round}
.halo .track{stroke:var(--line)}
.halo .arc{stroke:var(--accent);stroke-dasharray:96 400;opacity:.85}
.mark{width:84px;height:84px;display:block;filter:drop-shadow(0 18px 30px var(--shadow))}
.mark .tile{fill:var(--tile);stroke:var(--tile-line)}
.mark .trunk{stroke:var(--mark-ink)}
.mark .path{stroke-dasharray:1;animation:draw 2.4s cubic-bezier(.22,.78,.24,1) infinite}
.mark .branch{animation-delay:.18s}
.mark .node{transform-box:fill-box;transform-origin:50% 50%;animation:node 2.4s cubic-bezier(.16,1,.3,1) infinite}
.dot{position:absolute;border-radius:50%;animation:twinkle 2.4s ease-in-out infinite}
.dot.one{width:12px;height:12px;top:10px;inset-inline-start:14px;background:var(--amber)}
.dot.two{width:8px;height:8px;bottom:16px;inset-inline-end:10px;background:var(--sky);animation-delay:1.2s}
h1{margin:0;font-size:clamp(22px,5.6vw,27px);font-weight:700;line-height:1.5;letter-spacing:0}
.lead{margin:6px 0 0;font-size:16px;line-height:1.7;color:var(--muted)}
.pulse{width:132px;height:2px;margin:26px 0 28px;border-radius:99px;background:var(--line);overflow:hidden}
.pulse i{display:block;width:36%;height:100%;border-radius:inherit;background:linear-gradient(90deg,transparent,var(--scan),transparent);animation:scan 1.5s ease-in-out infinite}
button{
  min-height:44px;padding:0 22px;border-radius:14px;cursor:pointer;
  border:1px solid var(--button-line);background:var(--button);color:var(--ink);
  font:inherit;font-size:14px;font-weight:700;
  transition:border-color .2s ease,transform .2s ease;
}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.note{min-height:20px;margin:14px 0 0;font-size:13px;line-height:1.6;color:var(--muted)}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes draw{0%{stroke-dashoffset:1}55%,100%{stroke-dashoffset:0}}
@keyframes node{0%,35%{transform:scale(.6);opacity:.4}60%,100%{transform:none;opacity:1}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes scan{0%{transform:translateX(130%)}100%{transform:translateX(-360%)}}
@media (prefers-reduced-motion:reduce){
  .halo,.mark .path,.mark .node,.dot,.pulse i{animation:none}
  .mark .path{stroke-dashoffset:0}
  .dot{opacity:.8}
}
</style>
</head>
<body>
<main>
  <div class="stage" aria-hidden="true">
    <svg class="halo" viewBox="0 0 132 132" focusable="false"><circle class="track" cx="66" cy="66" r="63"/><circle class="arc" cx="66" cy="66" r="63"/></svg>
    <svg class="mark" viewBox="0 0 72 72" fill="none" focusable="false">
      <rect class="tile" x="2" y="2" width="68" height="68" rx="23"/>
      <path class="path trunk" pathLength="1" d="M18 18v12c0 7.2 5.8 13 13 13h9c7.8 0 14 6.2 14 14v3" stroke-width="4.6" stroke-linecap="round"/>
      <path class="path branch" pathLength="1" d="M18 18h10M44 16h10v10" stroke="#2f7d65" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="18" cy="18" r="5" fill="#e0a04b"/>
      <circle cx="54" cy="60" r="5" fill="#5e79e6"/>
      <circle class="node" cx="38" cy="43" r="4.8" fill="#2f7d65" stroke="#fffdf7" stroke-width="2"/>
    </svg>
    <span class="dot one"></span>
    <span class="dot two"></span>
  </div>
  <h1 id="title">نُحدّث البرنامج الآن</h1>
  <p class="lead" id="lead">لحظاتٍ ونعود</p>
  <div class="pulse" aria-hidden="true"><i></i></div>
  <button type="button" id="retry">أعد المحاولة الآن</button>
  <p class="note" id="note" role="status" aria-live="polite">ستُفتح الصفحة التي طلبتها تلقائياً حين نعود.</p>
</main>
<script>
(function () {
  var HEALTH = "/api/health";
  var FIRST = 3000, CEILING = 15000, PATIENT = 30000;
  var KEY = "nahj-updating-reloads";
  var tries = 0, timer = 0, asking = false;
  var title = document.getElementById("title");
  var lead = document.getElementById("lead");
  var note = document.getElementById("note");

  /* إعاداتُ التحميل في الدقيقتين الأخيرتين: ثلاثٌ والخادمُ سليم تعني أن الصفحة
     نفسها تتعثّر، فلا ندور في حلقة. */
  function recent() {
    try {
      var now = Date.now();
      return JSON.parse(sessionStorage.getItem(KEY) || "[]").filter(function (t) { return now - t < 120000; });
    } catch (e) { return []; }
  }
  function remember() {
    try { var list = recent(); list.push(Date.now()); sessionStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
  }
  function stuck() { return recent().length >= 3; }

  /* فُتحت هذه الصفحة باسمها مباشرة: العودة إلى البداية، لا إليها. */
  function reopen() {
    remember();
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  }

  function describe() {
    if (navigator.onLine === false) {
      title.textContent = "لا اتصال بالإنترنت الآن";
      lead.textContent = "سنعود تلقائياً حين يعود الاتصال";
      note.textContent = "";
    } else if (stuck()) {
      title.textContent = "نُحدّث البرنامج الآن";
      lead.textContent = "يستغرق ذلك وقتاً أطول من المعتاد";
      note.textContent = "سنحاول مرّةً كل نصف دقيقة، ويمكنك المحاولة الآن.";
    } else {
      title.textContent = "نُحدّث البرنامج الآن";
      lead.textContent = "لحظاتٍ ونعود";
      note.textContent = "ستُفتح الصفحة التي طلبتها تلقائياً حين نعود.";
    }
  }

  function wait() {
    if (stuck()) return PATIENT;
    return Math.min(CEILING, Math.round(FIRST * Math.pow(1.3, Math.max(0, tries - 5))));
  }
  function later() { clearTimeout(timer); timer = setTimeout(ask, wait()); }

  function ask() {
    clearTimeout(timer);
    if (asking) return;
    if (navigator.onLine === false) { describe(); later(); return; }
    asking = true;
    tries++;
    var control = typeof AbortController === "function" ? new AbortController() : null;
    var guard = setTimeout(function () { if (control) control.abort(); }, 8000);
    fetch(HEALTH, { cache: "no-store", credentials: "same-origin", signal: control ? control.signal : undefined })
      .then(function (response) { return response.ok; }, function () { return false; })
      .then(function (ok) {
        clearTimeout(guard);
        asking = false;
        if (ok) { reopen(); return; }
        describe();
        later();
      });
  }

  document.getElementById("retry").addEventListener("click", function () {
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  });
  window.addEventListener("online", function () { describe(); ask(); });
  window.addEventListener("offline", describe);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) ask(); });

  describe();
  later();
})();
</script>
</body>
</html>
